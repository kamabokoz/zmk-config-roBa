CONFIG_NFCT_PINS_AS_GPIOS=y
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

CONFIG_ZMK_POINTING=y

#DYA-STUDIO
CONFIG_ZMK_BATTERY_HISTORY=n
CONFIG_ZMK_BATTERY_HISTORY_INTERVAL_MINUTES=30
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000

#DYA-STUDIO 診断タブ(L側の記録・統計をcentral経由で参照するため)
CONFIG_ZMK_WATCHDOG=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS=y
# R側と同じ値にする
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=256
